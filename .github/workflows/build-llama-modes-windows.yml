name: Build llama-modes Windows CUDA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install CUDA 13.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.4'
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Compiler cache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: llama-modes-windows-cuda-13.4
          evict-old-files: 7d

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_UI=OFF ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=120

      - name: Build llama-server
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build build --config Release --target llama-server

      - name: Package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $src = "build\bin\Release"
          $dst = "package"

          New-Item -ItemType Directory -Force -Path $dst | Out-Null

          # Copy llama.cpp binaries and runtime DLLs
          Copy-Item "$src\*" $dst -Recurse -Force

          Write-Host "CUDA_PATH = $env:CUDA_PATH"

          # CUDA can place its runtime DLLs in slightly different directories.
          $cudaDirs = @(
            "$env:CUDA_PATH\bin",
            "$env:CUDA_PATH\lib",
            "$env:CUDA_PATH\bin\x64"
          )

          foreach ($dir in $cudaDirs) {
            if (Test-Path $dir) {
              Write-Host "Searching CUDA DLLs in: $dir"

              Get-ChildItem -Path $dir -Filter "cudart64_*.dll" -ErrorAction SilentlyContinue |
                Copy-Item -Destination $dst -Force

              Get-ChildItem -Path $dir -Filter "cublas64_*.dll" -ErrorAction SilentlyContinue |
                Copy-Item -Destination $dst -Force

              Get-ChildItem -Path $dir -Filter "cublasLt64_*.dll" -ErrorAction SilentlyContinue |
                Copy-Item -Destination $dst -Force
            }
          }

          Write-Host ""
          Write-Host "Packaged files:"
          Get-ChildItem $dst | Select-Object Name, Length

          # Fail the workflow instead of producing an incomplete artifact.
          $requiredPatterns = @(
            "llama-server.exe",
            "ggml-cuda.dll",
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll"
          )

          foreach ($pattern in $requiredPatterns) {
            if (-not (Get-ChildItem -Path $dst -Filter $pattern -ErrorAction SilentlyContinue)) {
              throw "Required runtime file missing: $pattern"
            }
          }

          Compress-Archive `
            -Path "$dst\*" `
            -DestinationPath "llama-modes-win-cuda.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-modes-win-cuda
          path: llama-modes-win-cuda.zip
